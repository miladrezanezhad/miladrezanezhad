name: Live Profile Update

on:
  schedule:
    - cron: '*/30 * * * *'  # هر ۳۰ دقیقه
  workflow_dispatch:

jobs:
  update-ecosystem:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ============================================
      # بخش 1: متریکس کامل گیت‌هاب
      # ============================================
      - name: 📊 Full Metrics Suite
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: .github/metrics.svg
          base: header, activity, repositories
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_stars: yes
          plugin_followup: yes

      # ============================================
      # بخش 2: اطلاعات لحظه‌ای (APIهای زنده)
      # ============================================
      - name: 🔥 Live Data (Cut Days + USD + Weather)
        run: |
          mkdir -p .github/badges

          # 1. روز قطعی اینترنت (شروع: 2026-02-28)
          START="2026-02-28"
          TODAY=$(date +%Y-%m-%d)
          CUT_DAYS=$(( ( $(date -d "$TODAY" +%s) - $(date -d "$START" +%s) ) / 86400 ))

          # 2. قیمت دلار (با fallback)
          USD=$(curl -s 'https://api.tgju.org/v1/price/usd' | jq -r '.price' 2>/dev/null || echo "N/A")

          # 3. آب و هوای بابلسر
          WEATHER=$(curl -s 'https://api.open-meteo.com/v1/forecast?latitude=36.7026&longitude=52.6576&current_weather=true' | jq -r '.current_weather.temperature' 2>/dev/null || echo "?")
          
          # ساخت Badgeهای داینامیک
          echo "{\"schemaVersion\":1,\"label\":\"🇮🇷 Iran Cut\",\"message\":\"Day $CUT_DAYS\",\"color\":\"ff0000\"}" > .github/badges/cut-days.json
          echo "{\"schemaVersion\":1,\"label\":\"💰 USD\",\"message\":\"${USD} Toman\",\"color\":\"ffcc00\"}" > .github/badges/usd.json
          echo "{\"schemaVersion\":1,\"label\":\"🌡️ Tehran\",\"message\":\"${WEATHER}°C\",\"color\":\"00aaff\"}" > .github/badges/weather.json

      # ============================================
      # بخش 3: مار زنده (Snake Animation)
      # ============================================
      - name: 🐍 Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            .github/snake.svg
            .github/snake-dark.svg?palette=github-dark

      # ============================================
      # بخش 4: ذخیره و آپلود خودکار
      # ============================================
      - name: Commit and Push All
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add .github/
          git diff --cached --quiet || git commit -m "🤖 Auto-update: $(date +'%Y-%m-%d %H:%M:%S')"
          git push
