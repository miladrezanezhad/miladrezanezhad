name: GitHub Metrics Full

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          committer_message: "📊 Update metrics dashboard"
          
          # ==================== پایه ====================
          base: header, activity, repositories
          base_indepth: yes
          repositories_forks: yes
          
          # ==================== زبان‌ها (بدون indepth) ====================
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          # غیرفعال کردن indepth mode که باعث خطا می‌شود
          plugin_languages_analysis_timeout: 0
          
          # ==================== تقویم مشارکت ====================
          plugin_calendar: yes
          plugin_calendar_limit: 1
          
          # ==================== فعالیت‌های اخیر ====================
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 14
          
          # ==================== دستاوردها ====================
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          
          # ==================== ستاره‌ها ====================
          plugin_stars: yes
          plugin_stars_limit: 4
          
          # ==================== فالوآپ ====================
          plugin_followup: yes
          
          # ==================== خطوط کد تغییر یافته ====================
          plugin_lines: yes
          
          # ==================== مشارکت‌های برجسته ====================
          plugin_notable: yes
          plugin_notable_from: organization
          
          # ==================== تقویم سه‌بعدی ====================
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # ==================== ترافیک مخازن ====================
          plugin_traffic: yes
          
          # ==================== مخازن محبوب ====================
          plugin_repositories: yes
          plugin_repositories_order: featured, pinned
          plugin_repositories_pinned: 4
          
          # ==================== پلاگین‌هایی که نیاز به توکن دارند (غیرفعال) ====================
          # plugin_steam: yes
          # plugin_steam_user: miladrezanezhad
          # plugin_steam_sections: recent, played
          
          # plugin_anilist: yes
          # plugin_anilist_user: miladrezanezhad
          
          # plugin_leetcode: yes
          # plugin_leetcode_user: miladrezanezhad
          
          # plugin_stackoverflow: yes
          # plugin_stackoverflow_user: YOUR_USER_ID
