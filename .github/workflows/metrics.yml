name: GitHub Metrics Full

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          committer_message: "📊 Update metrics dashboard"
          
          # ==================== پایه ====================
          base: header, activity, repositories
          base_indepth: yes
          repositories_forks: yes
          
          # ==================== زبان‌ها ====================
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_colors: github
          plugin_languages_limit: 10
          plugin_languages_details: bytes-size, percentage
          
          # ==================== تقویم مشارکت ====================
          plugin_calendar: yes
          plugin_calendar_limit: 1
          
          # ==================== فعالیت‌های اخیر ====================
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 14
          
          # ==================== دستاوردها ====================
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          
          # ==================== ستاره‌ها ====================
          plugin_stars: yes
          plugin_stars_limit: 6
          
          # ==================== فالوآپ ====================
          plugin_followup: yes
          
          # ==================== خطوط کد تغییر یافته ====================
          plugin_lines: yes
          
          # ==================== مشارکت‌های برجسته ====================
          plugin_notable: yes
          
          # ==================== تقویم سه‌بعدی ====================
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # ==================== ترافیک مخازن ====================
          plugin_traffic: yes
          
          # ==================== مخازن محبوب ====================
          plugin_repositories: yes
          plugin_repositories_order: featured, pinned
          plugin_repositories_pinned: 4
          
          # ==================== پلاگین‌های اضافی (جدید) ====================
          # گیت‌هاست (Gists)
          plugin_gists: yes
          
          # مشارکت در مخازن خاص (اختیاری)
          # plugin_contributors: yes
          # plugin_contributors_repositories: user/repo
          
          # لایسنس مخازن
          plugin_licenses: yes
          plugin_licenses_ratio: 0.5
          
          # لیدکد
          plugin_leetcode: yes
          plugin_leetcode_user: miladrezanezhad
          plugin_leetcode_sections: solved, skills
          
          # شطرنج (Chess.com)
          plugin_chess: yes
          plugin_chess_user: miladrezanezhad
          
          # انیلین (Anilist)
          plugin_anilist: yes
          plugin_anilist_user: miladrezanezhad
          plugin_anilist_sections: watching, stats
          
          # استیم
          plugin_steam: yes
          plugin_steam_user: miladrn1
          plugin_steam_sections: recent, played
