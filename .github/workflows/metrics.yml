name: GitHub Metrics Full

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          committer_message: "📊 Update metrics dashboard"
          
          # ==================== پایه ====================
          base: header, activity, repositories
          base_indepth: yes
          repositories_forks: yes
          
          # ==================== زبان‌ها ====================
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: bytes-size, percentage
          plugin_languages_analysis_timeout: 0
          
          # ==================== تقویم مشارکت ====================
          plugin_calendar: yes
          plugin_calendar_limit: 1
          
          # ==================== فعالیت‌های اخیر (ساده شده) ====================
          plugin_activity: yes
          plugin_activity_limit: 4
          plugin_activity_days: 7
          plugin_activity_filter: issue, pr
          plugin_activity_timestamps: false
          
          # ==================== دستاوردها (ساده شده) ====================
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: no
          plugin_achievements_display: compact
          plugin_achievements_limit: 6
          
          # ==================== ستاره‌ها ====================
          plugin_stars: yes
          plugin_stars_limit: 4
          
          # ==================== فالوآپ ====================
          plugin_followup: yes
          plugin_followup_sections: repositories
          
          # ==================== خطوط کد ====================
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 3
          
          # ==================== مشارکت‌های برجسته ====================
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_types: commit
          plugin_notable_self: no
          
          # ==================== تقویم سه‌بعدی ====================
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # ==================== ترافیک مخازن ====================
          plugin_traffic: yes
          
          # ==================== مخازن محبوب ====================
          plugin_repositories: yes
          plugin_repositories_order: featured, pinned
          plugin_repositories_pinned: 4
          
          # ==================== پلاگین‌های غیرفعال (برای جلوگیری از خطا) ====================
          # plugin_gists: no
          # plugin_licenses: no
          # plugin_leetcode: no
          # plugin_chess: no
          # plugin_anilist: no
          # plugin_steam: no
          # plugin_wakatime: no
          # plugin_stackoverflow: no
          # plugin_posts: no
