name: Create full counter badge with BYOB
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate elapsed time since internet cut
        id: calculate
        run: |
          START_DATE="2026-02-28"
          START_TIMESTAMP=$(date -d "$START_DATE 00:00:00" +%s)
          CURRENT_TIMESTAMP=$(date +%s)
          
          DIFF_SECONDS=$((CURRENT_TIMESTAMP - START_TIMESTAMP))
          
          DAYS=$((DIFF_SECONDS / 86400))
          HOURS=$(((DIFF_SECONDS % 86400) / 3600))
          MINUTES=$(((DIFF_SECONDS % 3600) / 60))
          SECONDS=$((DIFF_SECONDS % 60))
          
          WEEKS=$((DAYS / 7))
          REMAINING_DAYS=$((DAYS % 7))
          
          echo "days=$DAYS" >> $GITHUB_OUTPUT
          echo "hours=$HOURS" >> $GITHUB_OUTPUT
          echo "minutes=$MINUTES" >> $GITHUB_OUTPUT
          echo "seconds=$SECONDS" >> $GITHUB_OUTPUT
          echo "weeks=$WEEKS" >> $GITHUB_OUTPUT
          echo "remaining_days=$REMAINING_DAYS" >> $GITHUB_OUTPUT
          
          MESSAGE="$DAYS days, $HOURS hrs, $MINUTES mins, $SECONDS secs"
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Create full counter badge with BYOB
        uses: RubbaBoy/BYOB@v1.3.0
        with:
          NAME: iran-internet-cut-full
          LABEL: '📡 Iran Internet Cut'
          STATUS: '${{ steps.calculate.outputs.message }}'
          COLOR: red
          ICON: '⚠️'
          BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create week badge with BYOB
        uses: RubbaBoy/BYOB@v1.3.0
        with:
          NAME: iran-internet-cut-week
          LABEL: '📅 Iran Internet Cut'
          STATUS: 'Week ${{ steps.calculate.outputs.weeks }} - ${{ steps.calculate.outputs.days }} days'
          COLOR: orange
          ICON: '📆'
          BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Update counter: ${{ steps.calculate.outputs.days }} days, ${{ steps.calculate.outputs.hours }} hours"
          git push
