name: Update Internet Cut Counter

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # این خط مهم است!
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate days since last internet cut
        id: calculate
        run: |
          START_DATE="2025-01-07"
          CURRENT_DATE=$(date +%Y-%m-%d)
          DAYS=$(( ( $(date -d "$CURRENT_DATE" +%s) - $(date -d "$START_DATE" +%s) ) / 86400 ))
          echo "days=$DAYS" >> $GITHUB_OUTPUT

      - name: Create badge.json
        run: |
          mkdir -p .github/badges
          cat > .github/badges/internet-cut.json << EOF
          {
            "schemaVersion": 1,
            "label": "🇮🇷 روز قطعی اینترنت",
            "message": "${{ steps.calculate.outputs.days }}",
            "color": "red",
            "labelColor": "333333",
            "style": "for-the-badge"
          }
          EOF

      - name: Commit and push badge.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/badges/internet-cut.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update internet cut counter: ${{ steps.calculate.outputs.days }} days"
          git push origin HEAD:main
